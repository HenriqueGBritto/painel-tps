[build]
  # Os testes rodam antes de cada publicação: se algum falhar, a publicação é cancelada e o site fica na versão anterior.
  command = "npm test"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/lib/initial-operations.json", "netlify/lib/initial-discharge.json"]

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
