# Verificação automática das requisições de estiva no sistema do OGMO (robot/ogmo.mjs).
# Quem dá a largada é o Netlify (netlify/functions/ogmo-scheduled.mjs): de hora em hora e 1 hora antes de cada
# limite do OGMO (02:45, 08:45, 14:45 e 17:45 em Brasília). O agendamento do próprio GitHub pulava e atrasava rodadas.
# Segredos (Settings → Secrets and variables → Actions): OGMO_EMPRESA, OGMO_USUARIO, OGMO_SENHA, OGMO_SYNC_TOKEN.
# Para testar sem mandar nada ao painel: Actions → Verificação OGMO → Run workflow → modo "diagnostico".
# A aba Requisições também aciona daqui a busca de um dia ou período ("Buscar no OGMO": entradas datas e pedido).
name: Verificação OGMO

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "normal (manda ao painel) ou diagnostico (só lista e testa o PDF)"
        type: choice
        options: [normal, diagnostico]
        default: normal
      datas:
        description: "busca da aba Requisições: dias AAAA-MM-DD:AAAA-MM-DD (vazio = ontem, hoje e amanhã)"
        type: string
        default: ""
      pedido:
        description: "busca da aba Requisições: id do pedido (preenchido pelo painel)"
        type: string
        default: ""

# Uma rodada por vez: se uma atrasar, a próxima espera em vez de entrar junto no OGMO.
concurrency:
  group: ogmo
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Usa o Google Chrome que já vem na máquina do GitHub (ubuntu-latest): sem baixar navegador nem imagem.
    # Antes era a imagem do Playwright, que levava ~47 s só para preparar a cada rodada.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: robot/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: robot
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: node ogmo.mjs
        working-directory: robot
        env:
          TZ: America/Sao_Paulo
          OGMO_NAVEGADOR: chrome
          OGMO_MODO: ${{ inputs.modo || 'normal' }}
          OGMO_DATAS: ${{ inputs.datas }}
          OGMO_PEDIDO: ${{ inputs.pedido }}
          OGMO_EMPRESA: ${{ secrets.OGMO_EMPRESA }}
          OGMO_USUARIO: ${{ secrets.OGMO_USUARIO }}
          OGMO_SENHA: ${{ secrets.OGMO_SENHA }}
          OGMO_SYNC_TOKEN: ${{ secrets.OGMO_SYNC_TOKEN }}
          OGMO_BOTAO_PDF: ${{ vars.OGMO_BOTAO_PDF }}
          PAINEL_URL: ${{ vars.PAINEL_URL || 'https://paineltps.netlify.app' }}
      # Em caso de falha, a imagem da tela ajuda a ver onde parou (fica 3 dias).
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tela-da-falha
          path: robot/falha.png
          retention-days: 3
          if-no-files-found: ignore
